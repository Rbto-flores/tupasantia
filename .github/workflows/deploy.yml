name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production 
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2
          
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          
      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy to VPS
        run: |
            CHANGED=$(git diff --name-only HEAD^ HEAD | grep -E 'composer\.json|composer\.lock' || true)

            ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
              cd /var/www/tupasantia
              git pull origin main

              if [ ! -z "$CHANGED" ]; then
                echo "composer.json or composer.lock changed. Running composer install..."
                composer install --no-dev
              else
                echo "No composer changes, skipping install."
              fi

              php artisan optimize
              php artisan cache:clear
            EOF